name: Make sure new PRs are sent to next

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: Vankka/pr-target-branch-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target: /master|branch-.*/
          exclude: /next|next-.*/ # Don't prevent going from development -> main
          change-to: next
          comment: |
              Your PR was set to target `master` or a release branch, PRs should target `next`
              The base branch of this PR has been automatically changed to `next`, please check that there are no merge conflicts

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.4.0
    hooks:
    -   id: trailing-whitespace
        exclude: >
            (?x)^(
                .git/*|
                test_data/.*|
                cassandra-sstables/.*|
                alternator/.*
            )$
    -   id: end-of-file-fixer
        exclude: >
            (?x)^(
                .git/*|
                test_data/.*|
                cassandra-sstables/.*|
                test-sstables/.*|
                alternator/.*
            )$
    -   id: check-yaml
        args:
        - --allow-multiple-documents
    -   id: check-added-large-files
    -   id: check-json
    -   id: detect-aws-credentials
    -   id: detect-private-key

-   repo: local
    hooks:
    -   id: autopep8
        name: autopep8
        entry: autopep8 -i -j 2 --max-line-length=120 --ignore=E226,E24,W50,W690,E402
        language: system
        types: [python]

    -   id: pylint
        name: pylint
        entry: pylint -j 2 -E
        files: >
            (?x)^(
                tools/.*|
                conftest.py|
                cassandra_batch_test.py|
                cdc_types_test.py|
                dtest_class.py|
                dtest_setup.py|
                deletion_test.py|
                bootstrap_test.py|
                migration_test.py|
                simple_driver_test.py|
                multidc_putget_test.py|
                consistent_bootstrap_test.py|
                replace_address_test.py|
                jmxmetrics_test.py|
                json_test.py|
                native_transport_ssl_test.py|
                read_amplification_test.py|
                cfid_test.py|
                cdc_ttl_test|
                cdc_tests|
                cql_system_clients_test.py|
                internode_ssl_test.py|
                lwt_banking_load_test.py|
                lwt_schema_modification_test.py|
                lwt_test.py|
                lwt_random_test.py|
                auth_test.py|
                snapshot_test|
                udtencoding_test.py|
                clustering_key_filter_test.py|
                ttl_test.py|
                user_types_test.py|
                hintedhandoff_test.py|
                materialized_views_test.py|
                toppartitions_test.py|
                resharding_test.py|
                upgrade_through_versions_test.py|
                heat_weighted_load_balancing_test.py|
                upgrade_test.py|
                consistency_test.py|
                secondary_indexes_test.py|
                like_operator_test.py|
                sstableutil_test.py|
                sstablesplit_test.py|
                jmx_test.py
            )$
        language: system
        types: [python]

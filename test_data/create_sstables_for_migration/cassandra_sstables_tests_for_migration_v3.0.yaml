to_check_consistency:
  cmds: [["cqlsh", "CREATE KEYSPACE ks WITH replication={'class':'SimpleStrategy', 'replication_factor':1}"],
         ["cqlsh", "CREATE COLUMNFAMILY ks.cf (p1 text, r1 int, PRIMARY KEY (p1)) WITH read_repair_chance=0.000000"],
         ["cqlsh", "INSERT INTO ks.cf (p1, r1) VALUES ('key1', 1)"],
         ["nodetool", "flush"],
         ["subfolder", "1"],
         ["cqlsh", "INSERT INTO ks.cf (p1, r1) VALUES ('key1', 2)"],
         ["nodetool", "flush"],
         ["subfolder", "2"],
         ["cqlsh", "DROP KEYSPACE ks"],
         ["delete folder"]
        ]
  keyspace_name: 'ks'
  table_name: 'cf'

